name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      BINARY_NAME: tunneldesk-windows-amd64.exe

    steps:
      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Version must use a format such as v0.1.0 or v0.1.0-beta.1"
          }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Build Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o "dist\$env:BINARY_NAME" .\cmd\tunneldesk

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\$env:BINARY_NAME" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:BINARY_NAME" | Out-File "dist\SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          TunnelDesk $env:RELEASE_TAG

          Download the Windows executable and verify it with SHA256SUMS.txt.

          Requirements:
          - Windows 10 or 11
          - OpenVPN Community and its network adapter
          - Run as administrator until the Windows service is implemented
          "@

          $notes | Out-File release-notes.md -Encoding utf8
          gh release create $env:RELEASE_TAG "dist\$env:BINARY_NAME" "dist\SHA256SUMS.txt" --target $env:GITHUB_SHA --title "TunnelDesk $env:RELEASE_TAG" --notes-file release-notes.md
