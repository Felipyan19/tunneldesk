name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build Windows binary
        run: GOOS=windows GOARCH=amd64 go build -trimpath -o tunneldesk.exe ./cmd/tunneldesk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o tunneldesk.exe ./cmd/tunneldesk
